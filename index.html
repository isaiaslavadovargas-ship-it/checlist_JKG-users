<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APP Checklist JKG v.0.1</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EBE3;--card:#fff;--ink:#1F2A24;--mute:#5E6B62;--line:#CBD1C6;--green:#2F5D3A;--yellow:#F2C200;--red:#B3261E;--redbg:#FBE6E4;--okbg:#E1EFE3;--blue:#2B5FAE;--bluebg:#E3ECF9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A16;--card:#1D251F;--ink:#E8EDE5;--mute:#9AA89E;--line:#34403A;--green:#6BB57C;--redbg:#3A1E1C;--okbg:#1F3324;--red:#F0766D;--blue:#8DB3F0;--bluebg:#1E2C45}}
:root[data-theme="dark"]{--bg:#141A16;--card:#1D251F;--ink:#E8EDE5;--mute:#9AA89E;--line:#34403A;--green:#6BB57C;--redbg:#3A1E1C;--okbg:#1F3324;--red:#F0766D;--blue:#8DB3F0;--bluebg:#1E2C45}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;padding-bottom:96px}
header{background:var(--green);color:#fff;padding:18px 16px 14px;border-bottom:6px solid var(--yellow)}
header h1{font:700 28px/1 'Barlow Condensed',Impact,sans-serif;margin:0;letter-spacing:.5px}
header p{margin:4px 0 0;opacity:.85;font-size:14px}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
label:first-child{margin-top:0}
select,input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
h2{font:700 20px/1.1 'Barlow Condensed',Impact,sans-serif;margin:0 0 8px}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.q{font-weight:500;margin-bottom:8px}
.dm{font-size:13px;letter-spacing:-1px;margin-right:4px;white-space:nowrap}
.dm.l3{color:var(--red)}.dm.l2{color:var(--blue)}.dm.l1{color:var(--green)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opts button{font:600 15px Barlow,sans-serif;padding:11px 0;border-radius:8px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.opts button:focus-visible,.cta:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.opts button.on[data-v=ok]{background:var(--okbg);border-color:var(--green);color:var(--green)}
.opts button.on[data-v=fail]{background:var(--redbg);border-color:var(--red);color:var(--red)}
.al,.note{display:none;margin-top:8px}
.al{padding:8px 10px;border-radius:8px;font-weight:600;font-size:14px}
.al.l3{background:var(--redbg);color:var(--red)}.al.l2{background:var(--bluebg);color:var(--blue)}.al.l1{background:var(--okbg);color:var(--green)}
.item.f .al,.item.f .note{display:block}
.item.miss textarea{border-color:var(--red)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center}
.prog{flex:1;font-size:13px;color:var(--mute)}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.track i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
.cta{font:700 18px 'Barlow Condensed',Impact,sans-serif;background:var(--yellow);color:#1F2A24;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
.cta:disabled{opacity:.45}
.verdict{border-radius:10px;padding:16px;font:700 24px/1.1 'Barlow Condensed',Impact,sans-serif;margin-bottom:14px}
.verdict.ok{background:var(--okbg);color:var(--green)}.verdict.bad{background:var(--redbg);color:var(--red)}.verdict.warn{background:var(--bluebg);color:var(--blue)}
.verdict small{display:block;font:500 14px Barlow,sans-serif;margin-top:6px;color:var(--ink)}
.fl{margin:0;padding-left:18px}.fl li{margin-bottom:10px}
.err{color:var(--red);font-size:14px;margin-top:6px;display:none}
.sec{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chips:empty{display:none}
.chip{display:block;width:100%;text-align:center;border:2px solid var(--green);border-radius:12px;padding:16px 12px;font:700 28px/1.1 'Barlow Condensed',Impact,sans-serif;background:var(--okbg);color:var(--green)}
.sv{width:100%;margin-top:12px;font:600 15px Barlow,sans-serif;padding:11px;border-radius:8px;border:2px solid var(--green);background:transparent;color:var(--green);cursor:pointer}
.msg{font-size:13px;color:var(--green);margin-top:6px;min-height:18px}
.ob{display:inline-block;font:700 13px 'Barlow Condensed',Impact,sans-serif;padding:2px 8px;border-radius:6px;background:var(--redbg);color:var(--red);text-transform:uppercase}
.rt{font:700 30px/1.05 'Barlow Condensed',Impact,sans-serif;margin:0 0 10px;color:var(--green)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.dl dt{color:var(--mute);font-size:14px}.dl dd{margin:0;font-weight:600}
.orow{padding:10px 0;border-top:1px solid var(--line)}.orow:first-of-type{border-top:0}
.oh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.oh .ob{white-space:nowrap}.on{font-weight:600}
.od{margin-top:4px;white-space:pre-wrap}
.nn{color:var(--mute);font-size:14px;margin:0}
#result .rt,#result h2,#result .verdict{text-align:center}
.leg{font-size:13px;color:var(--mute);line-height:1.8}
</style>
</head>
<body>
<header><h1>JKG · Revisión diaria</h1><p>Checklist de maquinaria agrícola</p></header>

<main id="form">
  <div class="card">
    <div class="chips" id="chips" aria-live="polite"></div>
    <label for="tr">Tractor</label>
    <select id="tr"></select>
    <label for="df">Implemento</label>
    <select id="df"></select>
    <button class="sv" id="save" type="button">Actualizar maquinaria</button>
    <div class="msg" id="msg" role="status"></div>
    <label for="op">Operador</label>
    <input id="op" placeholder="Nombre y apellido" autocomplete="name">
    <label for="tn">Turno</label>
    <select id="tn"><option value="Día">Día</option><option value="Noche">Noche</option></select>
    <label for="hr">Horómetro</label>
    <input id="hr" type="text" inputmode="decimal" maxlength="7" autocomplete="off" placeholder="Ej. 23456.0">
  </div>
  <div class="card leg">
    <span class="dm l3">♦♦♦</span> Detener el equipo y solicitar asistencia<br>
    <span class="dm l2">♦♦</span> Comunicar al supervisor y continuar operando<br>
    <span class="dm l1">♦</span> Solución responsabilidad del operador
  </div>
  <div id="list"></div>
  <p class="err" id="err" role="alert"></p>
</main>
<main class="sec" id="result"></main>
<div class="bar" id="bar">
  <div class="prog"><span id="pt">0 de 0 revisados</span><div class="track"><i id="pb"></i></div></div>
  <button class="cta" id="send" disabled>Enviar revisión</button>
</div>
<script>
const SEC=[
["Tractor","Estado general",[["Indicadores panel de instrumentos",3],["Faros principales",2],["Faros neblineros / Luces pirata",2],["Luces direccionales / de estacionamiento",2],["Luces de freno",2],["Luces de retroceso",2],["Luz estroboscópica (circulina)",2],["Neumáticos",2],["Cinturones de seguridad",2],["Alarma de retroceso",2],["Bocina",2],["Estructuras / Chasis",2],["Orden y limpieza",1]]],
["Tractor","Estado mecánico/eléctrico",[["Dirección",3],["Nivel de aceite del motor",3],["Nivel de líquido de frenos",3],["Nivel de refrigerante",3],["Nivel de aceite hidráulico",3],["Embrague / TDF",2],["Mangueras",2]]],
["Tractor","Elementos de seguridad",[["Conos reflectivos (2)",1],["Caja de herramientas",1],["Extintor",1],["Tacos de seguridad",1],["Espejos",1]]],
["Implemento","Implemento",[["Bombas",3],["Cardán / Empalmes - Acoples implemento",3],["Tanque",2],["Boquillas",2]]]];
const ACT={3:"Detener el equipo y solicitar asistencia",2:"Comunicar al supervisor y continuar operando",1:"Solución responsabilidad del operador"};
const st={},K="jkg-conjuntos";let items=[],saved=null;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const esc=x=>x.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function opts(sel,groups){sel.innerHTML="";groups.forEach(([lab,list])=>{const g=document.createElement("optgroup");g.label=lab;list.forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;g.appendChild(o)});sel.appendChild(g)})}
const rng=(n,f)=>Array.from({length:n},(_,i)=>f(pad(i+1)));
opts($("tr"),[["MF",[["MF 01","MF 01"]]],["JD",rng(14,n=>["JD "+n,"JD "+n])]]);
opts($("df"),[["VAL",[["VAL 01","VAL 01"]]],["DEF",rng(17,n=>["DEF "+n,"DEF "+n])]]);
[$("tr"),$("df")].forEach(s=>{s.insertBefore(new Option("Seleccionar",""),s.firstChild);s.value=""});
const hh=new Date().getHours();$("tn").value=(hh>=6&&hh<18)?"Día":"Noche";
function build(){let h="",n=0;items=[];
  SEC.forEach(([k,g,its],si)=>{
    h+='<div class="card"><h2>'+(k==="Tractor"?"Tractor · ":"")+g+'</h2>';
    its.forEach(([q,c])=>{const id=n++;items.push({id,q,c,k,g});
      h+='<div class="item" id="i'+id+'"><div class="q"><span class="dm l'+c+'" aria-label="Criticidad '+c+' de 3">'+"♦".repeat(c)+'</span> '+q+'</div><div class="opts">'
      +['ok:OK','fail:Falla'].map(s=>{const[v,t]=s.split(':');return '<button data-id="'+id+'" data-v="'+v+'" aria-label="'+t+': '+q+'">'+t+'</button>'}).join('')
      +'</div><div class="al l'+c+'">'+ACT[c]+'</div><div class="note"><textarea rows="2" id="n'+id+'" placeholder="¿Qué falla tiene? (obligatorio)"></textarea></div></div>'});
    h+='<div class="item"><label for="o'+si+'">Otros (opcional)</label><textarea rows="2" id="o'+si+'" placeholder="Algo más que reportar en esta sección"></textarea></div></div>'});
  $("list").innerHTML=h;upd()}
function upd(){const d=items.filter(i=>st[i.id]).length;
  $("pt").textContent=d+" de "+items.length+" revisados";
  $("pb").style.width=(items.length?d/items.length*100:0)+"%";
  $("send").disabled=d<items.length}
$("list").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  const id=b.dataset.id,v=b.dataset.v;st[id]=v;const r=$("i"+id);
  r.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));r.classList.toggle("f",v==="fail");r.classList.remove("miss");upd()});
function persist(){try{localStorage.setItem(K,JSON.stringify(saved))}catch(_){}}
function load(){let v=null;try{v=JSON.parse(localStorage.getItem(K)||"null")}catch(_){}
  if(Array.isArray(v)&&Array.isArray(v[0]))v=v[v.length-1];
  if(Array.isArray(v)&&v.length===2){const t=v[0].replace(" - "," "),d=v[1];
    if([...$("tr").options].some(o=>o.value===t)&&[...$("df").options].some(o=>o.value===d)){saved=[t,d];$("tr").value=t;$("df").value=d}}
  persist()}
const NM={JD:"John Deere",MF:"Massey Ferguson",DEF:"Deflector",VAL:"Valencia"};
const full=v=>v.replace(/^(JD|MF|DEF|VAL)/,m=>NM[m]);
function chips(){const c=$("chips");c.innerHTML="";
  const w=document.createElement("div");w.className="chip";w.textContent=saved?full(saved[0])+" - "+full(saved[1]):"Seleccionar maquinaria";c.appendChild(w)}
$("save").addEventListener("click",()=>{if(!$("tr").value||!$("df").value){$("msg").textContent="Selecciona el tractor y el implemento.";return}
  saved=[$("tr").value,$("df").value];persist();chips();
  $("msg").textContent="Maquinaria actualizada: "+full(saved[0])+" - "+full(saved[1])});
$("send").addEventListener("click",()=>{
  const op=$("op").value.trim(),hr=fmtHr($("hr").value.trim()),er=$("err");
  const fails=items.filter(i=>st[i.id]==="fail").map(i=>({...i,note:$("n"+i.id).value.trim()}));
  const miss=fails.filter(f=>!f.note);
  let msg="";
  if(!$("tr").value||!$("df").value)msg="Selecciona el tractor y el implemento.";
  else if(!op||!/^\d{1,5}\.\d$/.test(hr))msg="Completa operador y horómetro (formato 23456.0) antes de enviar.";
  else if(miss.length){msg="Describe la falla en: "+miss.map(f=>f.q).join(", ")+".";miss.forEach(f=>$("i"+f.id).classList.add("miss"))}
  if(msg){er.style.display="block";er.textContent=msg;
    (miss.length&&op&&hr?$("i"+miss[0].id):$("form")).scrollIntoView({behavior:"smooth",block:"center"});return}
  er.style.display="none";
  fails.sort((a,b)=>b.c-a.c);
  const top=fails.length?fails[0].c:0;
  const ok=items.filter(i=>st[i.id]==="ok").length;
  const otros=SEC.map((s,i)=>[s[1],$("o"+i).value.trim()]).filter(o=>o[1]);
  const now=new Date();
  const T=["Apto para operar","Solucionar","Comunicar al supervisor","Detener el equipo"][top];
  let h='<div class="card"><h1 class="rt">'+full($("tr").value)+' - '+full($("df").value)+'</h1><dl class="dl"><dt>Operador</dt><dd>'+esc(op)+'</dd><dt>Fecha y hora</dt><dd>'+now.toLocaleDateString("es")+' '+now.toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})+'</dd><dt>Turno</dt><dd>'+$("tn").value+'</dd><dt>Horómetro</dt><dd>'+esc(hr)+'</dd></dl></div>'
  +'<div class="card"><h2>OBSERVACIONES</h2>'+(fails.length?fails.map(f=>'<div class="orow"><div class="oh"><span class="on">'+f.q+'</span><span class="ob">Observado</span></div><div class="od">'+esc(f.note)+'</div></div>').join(""):'<p class="nn">Sin observaciones</p>')+'</div>';
  h+='<div class="verdict '+(top===3?"bad":top===2?"warn":"ok")+'" style="margin:0">'+T+'</div>';
  $("form").style.display="none";$("bar").style.display="none";$("result").style.display="block";$("result").innerHTML=h;window.scrollTo(0,0);});
chips();build();
function fmtHr(v){if(/^\d{1,5}$/.test(v))return v+".0";if(/^\d{1,5}\.$/.test(v))return v+"0";return v}
$("hr").addEventListener("input",e=>{let v=e.target.value.replace(/,/g,".").replace(/[^0-9.]/g,"");const i=v.indexOf(".");let a=i<0?v:v.slice(0,i),b=i<0?null:v.slice(i+1).replace(/\./g,"");a=a.slice(0,5);v=b===null?a:a+"."+b.slice(0,1);e.target.value=v});
$("hr").addEventListener("blur",()=>{$("hr").value=fmtHr($("hr").value.trim())});
</script>
</body>
</html>
